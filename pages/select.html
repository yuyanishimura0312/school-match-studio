<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候補校を選ぶ | School Match Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/textbook.css">
<style>
.app-layout { max-width: 1200px; margin: 0 auto; padding: 32px 24px 100px; }
.step-indicator { display: flex; gap: 4px; margin-bottom: 24px; }
.step { flex: 1; padding: 8px 12px; font-family: var(--font); font-size: 0.7rem; text-align: center; border: 1px solid var(--border); color: var(--text-muted); background: var(--surface); }
.step.active { background: var(--accent-warm); color: white; border-color: var(--accent-warm); }
.step.done { color: var(--accent-warm); border-color: var(--accent-warm); }

.split-panel { display: grid; grid-template-columns: 1fr 360px; gap: 24px; margin-top: 16px; }
@media (max-width: 768px) { .split-panel { grid-template-columns: 1fr; } }

.school-list { background: var(--card); border: 1px solid var(--border); padding: 20px; }
.school-list h3 { font-family: var(--font-serif); font-size: 1rem; margin-bottom: 12px; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar input, .filter-bar select { padding: 6px 10px; font-family: var(--font); font-size: 0.8rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); }

.school-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; max-height: 600px; overflow-y: auto; padding: 4px; }

.school-card { padding: 10px 12px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: all 0.15s; font-family: var(--font); }
.school-card:hover { border-color: var(--accent-warm); }
.school-card.selected { background: var(--accent-muted); border-color: var(--accent-warm); }
.school-card.first-choice { background: rgba(204,20,0,0.15); border-color: var(--accent-warm); border-width: 2px; }
.school-card .name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
.school-card .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
.school-card .badge-fc { display: inline-block; background: var(--accent-warm); color: white; font-size: 0.6rem; padding: 1px 6px; margin-top: 4px; }

.cart-panel { background: var(--surface); border: 1px solid var(--border); padding: 18px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
.cart-panel h3 { font-family: var(--font-serif); font-size: 1rem; margin-bottom: 8px; }
.cart-panel .counter { font-family: var(--font); font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; }
.cart-panel .counter strong { color: var(--accent-warm); }

.cart-item { padding: 8px 10px; border: 1px solid var(--border-light); background: var(--bg); margin-bottom: 6px; font-family: var(--font); font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cart-item.first-choice { background: var(--accent-muted); border-color: var(--accent-warm); }
.cart-item .actions { display: flex; gap: 4px; flex-shrink: 0; }
.cart-item button { background: none; border: 1px solid var(--border); padding: 2px 6px; cursor: pointer; font-size: 0.7rem; color: var(--text-muted); }
.cart-item button:hover { border-color: var(--accent-warm); color: var(--accent-warm); }
.cart-item button.fc-btn.active { background: var(--accent-warm); color: white; border-color: var(--accent-warm); }

.cta-button { background: var(--accent-warm); color: white; border: none; padding: 12px 20px; font-family: var(--font); font-weight: 700; font-size: 0.85rem; cursor: pointer; width: 100%; margin-top: 12px; }
.cta-button:disabled { opacity: 0.4; cursor: not-allowed; }
.cta-button:hover:not(:disabled) { opacity: 0.85; }

.help-text { font-family: var(--font); font-size: 0.72rem; color: var(--text-muted); padding: 8px 0; line-height: 1.6; }
</style>
</head>
<body>
<div class="reading-progress" id="readingProgress"></div>
<header class="top-bar">
  <div class="top-bar-brand"><a href="../index.html" style="color: inherit; text-decoration: none;"><span>School Match Studio</span></a></div>
  <div class="top-bar-actions">
    <a href="../index.html" class="back-link">&#8592; トップ</a>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">DARK</button>
  </div>
</header>

<div class="app-layout">

<div class="step-indicator">
  <div class="step active">1. 候補校を選ぶ</div>
  <div class="step">2. 第一志望5校</div>
  <div class="step">3. レポート閲覧</div>
  <div class="step">4. 子どもの特徴</div>
  <div class="step">5. 人格適合</div>
</div>

<h1 class="book-title" style="margin-bottom: 8px;">候補校を選ぶ</h1>
<p class="help-text">最大20校までの候補校から、第一志望群5校を選びます。学校カードをクリックして候補に追加し、星マークで第一志望を選択。</p>

<div class="split-panel">
<div class="school-list">
<h3>学校カタログ <span style="font-family:var(--font); font-size:0.75rem; color:var(--text-muted); font-weight:normal;">(60校)</span></h3>
<div class="filter-bar">
  <input type="text" id="search-input" placeholder="学校名で検索..." style="flex: 1; min-width: 180px;">
  <select id="prefecture-filter" style="min-width: 120px;">
    <option value="">全都道府県</option>
  </select>
</div>
<div class="school-grid" id="school-grid"></div>
</div>

<div class="cart-panel">
<h3>選択中</h3>
<div class="counter">候補 <strong id="counter-candidates">0</strong>/20 ・ 第一志望 <strong id="counter-fc">0</strong>/5</div>
<div id="cart-list"></div>
<button class="cta-button" id="proceed-btn" disabled onclick="proceedToReports()">レポート生成へ進む →</button>
<p class="help-text">第一志望を1校以上選択するとレポート生成へ進めます</p>
</div>
</div>

</div>

<script src="../css/textbook-init.js"></script>
<script>
let SCHOOLS = [];
let candidates = []; // school IDs
let firstChoices = []; // school IDs (subset of candidates)

// Load saved state
const saved = JSON.parse(localStorage.getItem("sms_selection") || "{}");
candidates = saved.candidates || [];
firstChoices = saved.firstChoices || [];

fetch("../data/schools.json").then(r => r.json()).then(data => {
  SCHOOLS = data;
  initFilters();
  render();
});

function initFilters() {
  const prefs = [...new Set(SCHOOLS.map(s => s.prefecture).filter(Boolean))].sort();
  const sel = document.getElementById("prefecture-filter");
  prefs.forEach(p => {
    const o = document.createElement("option");
    o.value = p; o.textContent = p; sel.appendChild(o);
  });
  document.getElementById("search-input").addEventListener("input", render);
  document.getElementById("prefecture-filter").addEventListener("change", render);
}

function render() {
  const search = document.getElementById("search-input").value.toLowerCase();
  const pref = document.getElementById("prefecture-filter").value;
  const filtered = SCHOOLS.filter(s =>
    (!search || s.school_name.toLowerCase().includes(search)) &&
    (!pref || s.prefecture === pref)
  );

  document.getElementById("school-grid").innerHTML = filtered.map(s => {
    const isCandidate = candidates.includes(s.id);
    const isFC = firstChoices.includes(s.id);
    return `<div class="school-card ${isCandidate ? "selected" : ""} ${isFC ? "first-choice" : ""}" onclick="toggleSchool(${s.id})">
      <div class="name">${s.school_name}</div>
      <div class="meta">${s.prefecture || ""}</div>
      ${isFC ? '<div class="badge-fc">第一志望</div>' : ""}
    </div>`;
  }).join("");

  document.getElementById("counter-candidates").textContent = candidates.length;
  document.getElementById("counter-fc").textContent = firstChoices.length;

  // Cart list
  document.getElementById("cart-list").innerHTML = candidates.map(id => {
    const s = SCHOOLS.find(x => x.id === id);
    if (!s) return "";
    const isFC = firstChoices.includes(id);
    return `<div class="cart-item ${isFC ? "first-choice" : ""}">
      <span>${s.school_name}<small style="color:var(--text-muted); margin-left:4px;">${s.prefecture||""}</small></span>
      <div class="actions">
        <button class="fc-btn ${isFC ? "active" : ""}" onclick="toggleFC(${id}); event.stopPropagation();" title="第一志望">★</button>
        <button onclick="removeSchool(${id}); event.stopPropagation();" title="削除">✕</button>
      </div>
    </div>`;
  }).join("") || '<p class="help-text">候補校を追加してください</p>';

  document.getElementById("proceed-btn").disabled = firstChoices.length === 0;
}

function toggleSchool(id) {
  const idx = candidates.indexOf(id);
  if (idx >= 0) {
    candidates.splice(idx, 1);
    const fIdx = firstChoices.indexOf(id);
    if (fIdx >= 0) firstChoices.splice(fIdx, 1);
  } else {
    if (candidates.length >= 20) {
      alert("候補校は最大20校までです");
      return;
    }
    candidates.push(id);
  }
  saveState();
  render();
}

function toggleFC(id) {
  const idx = firstChoices.indexOf(id);
  if (idx >= 0) {
    firstChoices.splice(idx, 1);
  } else {
    if (firstChoices.length >= 5) {
      alert("第一志望は最大5校までです");
      return;
    }
    firstChoices.push(id);
  }
  saveState();
  render();
}

function removeSchool(id) {
  toggleSchool(id);
}

function saveState() {
  localStorage.setItem("sms_selection", JSON.stringify({candidates, firstChoices}));
}

function proceedToReports() {
  if (firstChoices.length === 0) return;
  window.location.href = "reports.html";
}
</script>
</body>
</html>
